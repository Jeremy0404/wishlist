version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/api"
      - "/web"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/web"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-compose-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
