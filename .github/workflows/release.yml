name: Release

on:
  push:
    tags: ['v*']

# This workflow builds the two production images (api and web) from their own
# Dockerfiles, pushes them to GHCR, and signs them keylessly with cosign using
# the GitHub Actions OIDC identity, then deploys the tag to mediaserver and
# confirms the containers actually running match the digests it verified.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image ref
        id: image
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.component }}
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    name: Sign ${{ matrix.component }} image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [api, web]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pushed digest
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          digest="$(docker buildx imagetools inspect "${repo}:${GITHUB_REF_NAME#v}" --format '{{ .Manifest.Digest }}')"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.ref }}"

      - name: Verify the published image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.ref }}"

  deploy:
    name: Deploy to mediaserver
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      api_digest: ${{ steps.digests.outputs.api }}
      web_digest: ${{ steps.digests.outputs.web }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve digests
        id: digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          for c in api web; do
            repo="ghcr.io/${GITHUB_REPOSITORY,,}-${c}"
            digest="$(docker buildx imagetools inspect "${repo}:${version}" --format '{{ .Manifest.Digest }}')"
            echo "${c}=${digest}" >> "$GITHUB_OUTPUT"
          done

      # Both images are verified before either is deployed: rollback.sh restarts
      # web and api together, so a signature failure on one must stop the deploy
      # of the other.
      - name: Verify both images are signed by this workflow
        run: |
          version="${GITHUB_REF_NAME#v}"
          for c in api web; do
            repo="ghcr.io/${GITHUB_REPOSITORY,,}-${c}"
            digest="$(docker buildx imagetools inspect "${repo}:${version}" --format '{{ .Manifest.Digest }}')"
            cosign verify \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v.*$" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${repo}@${digest}"
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: RELEASE_VERSION
          script: |
            set -euo pipefail
            cd ~/wishlist

            # rollback.sh rewrites RELEASE_VERSION, pulls, restarts web and api
            # together and polls the health endpoint — the same operation
            # whether this is a forward deploy or a manual rollback. The API
            # self-migrates on startup, so no separate migration step exists.
            ./deploy/rollback.sh "${RELEASE_VERSION#v}"

  verify-deploy:
    name: Verify running digests
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm the running containers match the verified, signed digests
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          API_DIGEST: ${{ needs.deploy.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.deploy.outputs.web_digest }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: API_DIGEST,WEB_DIGEST
          script: |
            set -euo pipefail
            cd ~/wishlist

            check() {
              svc="$1"; expected="$2"
              cid="$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env ps -q "$svc")"
              img="$(docker inspect --format '{{.Image}}' "$cid")"
              running="$(docker inspect --format '{{join .RepoDigests "\n"}}' "$img" | head -1)"
              echo "${svc} running: ${running}"
              case "$running" in
                *"$expected") echo "  matches the verified, signed release." ;;
                *) echo "  does NOT match ${expected}" >&2; exit 1 ;;
              esac
            }

            check api "$API_DIGEST"
            check web "$WEB_DIGEST"
